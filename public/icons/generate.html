<!doctype html>
<!--
  ReComp Life icon set: concept A, "Plate Sun" (sources and the other concepts in
  docs/plans/glass-box-mockups/logo/). Each PNG is a headless-Chrome screenshot of one SVG
  at its exact pixel size:
    icon-192.png, icon-512.png          icon.svg (rounded square, purpose "any")
    icon-maskable-192.png, -512.png     A-icon-dark.svg (full bleed, mark inside the 80% safe circle)
    apple-touch-icon.png (180)          A-icon-dark.svg (full bleed, opaque)
    src/app/icon.png (32)               A-favicon.svg (plate fills the square)
-->
<html>
<head><meta charset="utf-8"><title>ReComp Life icons</title></head>
<body style="margin:0;padding:24px;background:#1b1512;display:flex;gap:24px;align-items:flex-end">
  <img src="icon.svg" width="512" height="512" alt="ReComp Life icon">
  <img src="icon-maskable-192.png" width="192" height="192" alt="maskable icon">
  <img src="apple-touch-icon.png" width="180" height="180" alt="apple touch icon">
</body>
</html>
